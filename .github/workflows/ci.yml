name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libnetcdf-dev libnetcdff-dev

      - name: Build library
        run: make

      - name: Install library
        run: |
          sudo make install
          sudo ldconfig

      - name: Compile tests
        run: cd tests && make all

      - name: Run tests
        run: cd tests && make test
